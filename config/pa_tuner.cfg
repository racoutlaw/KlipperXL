# KlipperXL - automatic Pressure Advance sweep (XLPATuner Road B)
#
# PORTED FROM THE ACTUAL GCODE RICHARD RAN ON HIS STOCK XL, not from the generator's
# dataclass defaults and NOT from KAPAT. Source of truth:
#   E:\pa_tuner_1784597059.gcode  (PrusaPATuner output, PETG 240C, XL5IS)
# Every derived value below reproduces that file exactly -- verified line by line.
#
# WHY THIS MATTERS: the SweepParams dataclass defaults (0.4mm oscillation, 0.8/8.0
# mm/s, 1.0/0.25s legs, Z50) are NOT what the app actually emits. The app overrides
# them, and KAPAT's macro diverges further still. Building from either would have run
# a different experiment and produced a K that does not mean the same thing.
#
# VERIFIED AGAINST THE REAL GCODE
#   park/purge            X30 Y30 Z80
#   X oscillation         30.0000 <-> 31.0000  = 1.0 mm
#   slow leg              F30.00  E2.4945   -> 2.000 s
#   fast leg              F84.00  E4.1575   -> 0.714 s
#   warm-up leg (1st only) F6.00  E12.4726  -> 10.00 s  (= slow x 5)
#   cycles per K          10
#   K values              0.020 .. 0.070 step 0.002  (26 values)
#   preheat / test        250 / 240  (i.e. test + 10)
#   baseline              G4 P500 settle, then G4 P2000
#   Z marker              80 -> 82 -> 80, 100ms hold, then G4 P500
#   accel                 M201 E5000 + M204 P5000 R5000 T5000
#   total E               1742 mm (~4.2 g)
#
# THE FEEDS ARE VOLUMETRIC. Decoding the gcode:
#   slow 2.4945mm / 2.000s = 1.2473 mm/s x 2.4053 mm^2 =  3.0 mm^3/s
#   fast 4.1575mm / 0.714s = 5.8207 mm/s x 2.4053 mm^2 = 14.0 mm^3/s
# Exactly 3 and 14 mm^3/s, so flow is specified volumetrically and E is derived from
# filament cross-section. That is why the dataclass's raw mm/s numbers do not match.
#
# DELIBERATE, FLAGGED DEVIATIONS FROM THE STOCK GCODE
#   * M83 relative E instead of M82 + G92 E0 + cumulative absolute targets.
#     MOTION IS IDENTICAL. Stefan uses absolute because Buddy can silently flip E
#     mode mid-print; Klipper does not, and relative avoids a Jinja running-total
#     that could itself introduce a bug.
#   * No M591 S0 / M591 R. That disables Buddy's filament stuck-detection, which the
#     slow leg mimics. Verified there is NO filament_switch_sensor or
#     filament_motion_sensor in his printer.cfg, so nothing here can trip.
#   * No trailing `P0 S1` (park tool) or `M84`. Leaving the tool picked and motors
#     enabled keeps position known for whatever comes next.
#   * SET_VELOCITY_LIMIT ACCEL replaces M201/M204. These are composite XYE moves, so
#     Klipper's toolhead acceleration governs them.
#
# ⚠ MESS: a full sweep puts ~1742 mm (~4.2 g) of filament into free air at Z80,
#   dripping onto an unheated bed. That is what the stock tool did too.
# ⚠ Pick the tool FIRST -- the loadcell is per-Dwarf and only streams for the coupled
#   tool. TOOL= will pick it.

[gcode_macro CALIBRATE_PA]
description: PA sweep against the Dwarf loadcell, matching the stock PrusaPATuner run
gcode:
    _ASSERT_NOT_PRINTING WHAT=CALIBRATE_PA
    {% set TOOL       = params.TOOL|default(-1)|int %}
    {% set TEMP       = params.TEMP|default(240)|float %}
    {% set PREHEAT    = params.PREHEAT|default(TEMP + 10)|float %}

    # K RANGE 0.02..0.12. WIDENED 2026-08-16 and this matters a lot.
    # It was 0.02..0.07, copied from his stock PETG run. That range does NOT contain
    # the optimum for PLA on these tools, and when the optimum lies outside the swept
    # window every method extrapolates past the end of the data in its own way, so
    # they disagree. MEASURED on T2, same tool, same filament, only the range changed:
    #     0.02-0.07 : bd_k_opt 0.0472, integral 0.0588, rise 0.0632   (spread 0.016)
    #     0.02-0.12 : bd_k_opt 0.0647, integral 0.0579, rise 0.0655   (spread 0.008)
    # bd_k_opt moved 0.047 -> 0.065 purely from widening -- it was being clipped at
    # the boundary. With the wider range bd_k_opt and signed_rise agree to 0.0008 and
    # both fits are r2 > 0.96.
    # T0 only ever agreed because its true K (~0.040) happened to sit well inside the
    # old window. Do not narrow this back without checking the optimum is inside it.
    {% set START_K    = params.START_K|default(0.02)|float %}
    {% set END_K      = params.END_K|default(0.12)|float %}
    # DEFAULT SWEEP: 0.005 step over 0.02-0.12 = 21 values x 6 cycles = ~6 minutes.
    # This once defaulted to 0.002 x 10 over 0.02-0.07 = ~12 minutes, which was his
    # LONGEST stock parameterisation -- the plain command gave the slowest run unless
    # you remembered to type something else. The fine grid now lives in
    # CALIBRATE_PA_FINE; the range widened separately (see END_K above).
    #
    # CYCLES=6 IS A MEASURED FLOOR, NOT A PREFERENCE. The analyser discards any K
    # with fewer than 4 INCLUDED segments, and inclusion runs 67-85%. At CYCLES=4
    # every K was rejected and no K_opt came out (confirmed live 2026-08-15).
    # Do not lower it.
    {% set STEP_K     = params.STEP_K|default(0.005)|float %}
    {% set CYCLES     = params.CYCLES|default(6)|int %}

    # Volumetric flow, mm^3/s -- the real parameterisation.
    {% set SLOW_FLOW  = params.SLOW_FLOW|default(3.0)|float %}
    {% set FAST_FLOW  = params.FAST_FLOW|default(14.0)|float %}
    {% set SLOW_HALF  = params.SLOW_HALF_S|default(2.0)|float %}
    {% set FAST_HALF  = params.FAST_HALF_S|default(0.714286)|float %}
    {% set WARMUP     = params.WARMUP_FACTOR|default(5.0)|float %}
    {% set FIL_D      = params.FILAMENT_D|default(1.75)|float %}

    {% set OSC        = params.OSC_MM|default(1.0)|float %}
    {% set ACCEL      = params.ACCEL|default(5000)|float %}
    {% set Z_MARKER   = params.Z_MARKER_MM|default(2.0)|float %}
    {% set BASELINE   = params.BASELINE_S|default(2.0)|float %}
    {% set POLL       = params.POLL|default(0.020)|float %}
    {% set DO_HOME    = params.HOME|default(1)|int %}

    {% set X_BASE = params.X|default(30.0)|float %}
    {% set Y_BASE = params.Y|default(30.0)|float %}
    {% set Z_BASE = params.Z|default(80.0)|float %}

    # filament cross-section -> mm of filament per mm^3
    {% set AREA   = 3.14159265 * (FIL_D / 2.0) * (FIL_D / 2.0) %}
    {% set SLOW_E = (SLOW_FLOW / AREA) * SLOW_HALF %}
    {% set FAST_E = (FAST_FLOW / AREA) * FAST_HALF %}
    {% set WARM_E = SLOW_E * WARMUP %}
    # F is the XY trajectory velocity on a composite move; E is slaved to finish in
    # the same time. So F = 60 * osc / leg_seconds reproduces the stock feedrates.
    {% set SLOW_F = (OSC / SLOW_HALF) * 60 %}
    {% set FAST_F = (OSC / FAST_HALF) * 60 %}
    {% set WARM_F = (OSC / (SLOW_HALF * WARMUP)) * 60 %}

    {% set steps   = ((END_K - START_K) / STEP_K)|round|int %}
    {% set total_e = ((steps + 1) * CYCLES * (SLOW_E + FAST_E)) + (WARM_E - SLOW_E) %}

    {% set restore_accel = printer.configfile.settings.printer.max_accel %}

    RESPOND MSG="CALIBRATE_PA: K {START_K}..{END_K} step {STEP_K} = {steps|int + 1} values x {CYCLES} cycles"
    RESPOND MSG="CALIBRATE_PA: slow E{SLOW_E|round(4)} F{SLOW_F|round(2)} | fast E{FAST_E|round(4)} F{FAST_F|round(2)} | warmup E{WARM_E|round(4)} F{WARM_F|round(2)}"
    RESPOND MSG="CALIBRATE_PA: ~{total_e|round(0)}mm filament in free air at Z{Z_BASE}, osc {OSC}mm"

    SAVE_GCODE_STATE NAME=pa_sweep_state

    # SAFETY: home and park COLD. A failure in G28 or the park move must not leave a
    # hot nozzle behind -- Klipper runs nothing after a macro error. (Seen live.)
    #
    # ORDER MATTERS -- G28 MUST COME BEFORE THE TOOL PICK. His [homing_override] does
    # `T0  # Pick tool so loadcell is available` as part of Z homing. Picking T1 and
    # then homing would silently switch back to T0, so the sweep would record T0's
    # loadcell while the result was saved as T1's K. The recorder takes its Dwarf from
    # puppy.active_tool, so it would have looked perfectly consistent and been wrong.
    G90
    {% if DO_HOME %}
    G28
    {% endif %}

    {% if TOOL >= 0 %}
    T{TOOL}
    M400
    {% endif %}
    G1 X{X_BASE} Y{Y_BASE} Z{Z_BASE} F6000
    M400

    M104 S{PREHEAT}
    M109 S{PREHEAT}
    M83
    SET_VELOCITY_LIMIT ACCEL={ACCEL}

    G4 P500                                ; settle (stock: G4 P500 before baseline)

    START_PA_RECORDING POLL={POLL}

    {% if BASELINE > 0 %}
    RESPOND MSG="PA_BASELINE"
    G4 P{(BASELINE * 1000)|int}            ; static-load baseline / noise reference
    {% endif %}

    M104 S{TEMP}                           ; drop to test temp (stock does this here)

    {% if Z_MARKER > 0 %}
    G1 Z{Z_BASE + Z_MARKER} F1800          ; sweep_t0 marker UP
    G4 P100
    G1 Z{Z_BASE} F1800                     ; marker DOWN = sweep_t0
    {% endif %}
    RESPOND MSG="PA_SWEEP_START"
    G4 P500

    {% for i in range(steps + 1) %}
        {% set CURRENT_K = START_K + (i * STEP_K) %}
        SET_PRESSURE_ADVANCE ADVANCE={CURRENT_K}
        M118 K={CURRENT_K}
        {% for c in range(CYCLES) %}
            {% if i == 0 and c == 0 %}
            G1 X{X_BASE + OSC} E{WARM_E|round(4)} F{WARM_F|round(2)}
            {% else %}
            G1 X{X_BASE + OSC} E{SLOW_E|round(4)} F{SLOW_F|round(2)}
            {% endif %}
            G1 X{X_BASE} E{FAST_E|round(4)} F{FAST_F|round(2)}
        {% endfor %}
    {% endfor %}

    G1 X{X_BASE + OSC} E{SLOW_E|round(4)} F{SLOW_F|round(2)}   ; trailing slow leg
    M400
    RESPOND MSG="PA_SWEEP_END"

    STOP_PA_RECORDING TEMP={TEMP} START_K={START_K} END_K={END_K} STEP_K={STEP_K} CYCLES={CYCLES} SLOW_FLOW={SLOW_FLOW} FAST_FLOW={FAST_FLOW} SLOW_HALF_S={SLOW_HALF} FAST_HALF_S={FAST_HALF} WARMUP_FACTOR={WARMUP} OSC_MM={OSC} ACCEL={ACCEL} Z_MARKER_MM={Z_MARKER} BASELINE_S={BASELINE} FILAMENT_D={FIL_D}

    SET_PRESSURE_ADVANCE ADVANCE=0
    M104 S0
    SET_VELOCITY_LIMIT ACCEL={restore_accel}
    RESTORE_GCODE_STATE NAME=pa_sweep_state
    RESPOND MSG="CALIBRATE_PA: done - recording written, nothing applied"


# FINE grid: 0.002 step x 10 cycles, for a definitive number on a tool/filament you
# intend to keep. Over the full 0.02-0.12 that is 51 values = ~23 MINUTES.
#
# NORMALLY YOU DO NOT WANT THAT. Run the plain CALIBRATE_PA first (~6 min) to find
# roughly where K sits, then fine-grid a NARROW band around it. For a coarse result
# of 0.065:
#     CALIBRATE_PA_FINE TOOL=2 TEMP=215 START_K=0.05 END_K=0.08
# = 16 values, ~7 min, and far better resolution exactly where it matters.
[gcode_macro CALIBRATE_PA_FINE]
description: High-resolution PA sweep (0.002 step) - narrow the range or it runs ~23min
gcode:
    _ASSERT_NOT_PRINTING WHAT=CALIBRATE_PA_FINE
    CALIBRATE_PA START_K={params.START_K|default(0.02)} END_K={params.END_K|default(0.12)} STEP_K={params.STEP_K|default(0.002)} CYCLES={params.CYCLES|default(10)} TEMP={params.TEMP|default(240)} TOOL={params.TOOL|default(-1)} HOME={params.HOME|default(1)} POLL={params.POLL|default(0.020)}
