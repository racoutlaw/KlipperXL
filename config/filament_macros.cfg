# KlipperXL - UI buttons for filament load / unload
#
# The real work is done by LOAD_FILAMENT and UNLOAD_FILAMENT, which are registered
# in Python by puppy_bootloader.py and are Prusa's M701 / M702 sequences. They have
# always worked -- but Mainsail and Fluidd only list [gcode_macro] sections in their
# Macros panel, so a Python-registered command is invisible there no matter how well
# it works. These thin wrappers give them a button and a parameter form.
#
# NAMING: these are deliberately NOT called LOAD_FILAMENT / UNLOAD_FILAMENT. Klipper
# refuses to start if a [gcode_macro] tries to claim a command name that is already
# registered, so a same-name wrapper would break the printer at config load.
#
# No TOOL = the tool on the carriage; with none picked they refuse and ask for
# TOOL. (They used to fall back to T0, so a TOOL missed - e.g. typed into the
# old TEMP box - loaded or unloaded T0.)
#
# No temperature here: as stock Prusa, a load asks the filament type (PLA, PETG,
# ABS...) in a pop-up once the gears have the filament, and an unload heats for
# the type that tool was loaded with - asking first when it is not known (ASK=1).
# A tool already heating keeps its temperature. A temperature of your own:
# LOAD_FILAMENT / UNLOAD_FILAMENT TOOL=n TEMP=t in the console.

[gcode_macro FILAMENT_LOAD]
description: Load filament into a tool (Prusa M701 sequence)
gcode:
    {% set pb = printer.puppy_bootloader %}
    {% set TOOL = params.TOOL|default(-1)|int %}
    {% if 'TOOL' not in params %}
        {% if not pb.tool_picked %}
            { action_raise_error("FILAMENT_LOAD: no tool picked - give TOOL=0-4") }
        {% endif %}
        {% set TOOL = pb.active_tool|int %}
    {% endif %}
    {% if TOOL < 0 or TOOL > 4 %}
        { action_raise_error("FILAMENT_LOAD: TOOL must be 0-4, got %d" % TOOL) }
    {% endif %}
    RESPOND MSG="FILAMENT_LOAD: T{TOOL} - it will pick the tool, then wait for you to push filament in until the gears grab, then ask its type."
    LOAD_FILAMENT TOOL={TOOL}


[gcode_macro FILAMENT_UNLOAD]
description: Unload filament from a tool (Prusa M702 sequence)
gcode:
    {% set pb = printer.puppy_bootloader %}
    {% set TOOL = params.TOOL|default(-1)|int %}
    {% if 'TOOL' not in params %}
        {% if not pb.tool_picked %}
            { action_raise_error("FILAMENT_UNLOAD: no tool picked - give TOOL=0-4") }
        {% endif %}
        {% set TOOL = pb.active_tool|int %}
    {% endif %}
    {% if TOOL < 0 or TOOL > 4 %}
        { action_raise_error("FILAMENT_UNLOAD: TOOL must be 0-4, got %d" % TOOL) }
    {% endif %}
    RESPOND MSG="FILAMENT_UNLOAD: T{TOOL} - heating, ramming, then retracting."
    UNLOAD_FILAMENT TOOL={TOOL} ASK=1


[gcode_macro FILAMENT_SENSORS]
description: Show filament sensor states and calibration for all tools
gcode:
    SHOW_FILAMENT_SENSORS
