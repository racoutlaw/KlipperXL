# Prusa XL - Complete Klipper Configuration
# Corrected for 2-motor Z-axis with crash-based self-leveling
# NO programming knowledge required - just copy this entire file!

# ============================================================================
# INCLUDES
# ============================================================================
[include mainsail.cfg]
[include macros/print_macros.cfg]
[include pa_tuner.cfg]
[include pa_menu.cfg]
[include filament_macros.cfg]
[include light_macros.cfg]

# OPTIONAL EXTRAS -- OFF BY DEFAULT.
#
# Both of these need something this repo does not install for you, and Klipper
# refuses to start on an include it cannot find. They shipped uncommented until
# 2026-08-18, which meant a fresh install stopped dead on the first one with
# "Cannot find include file". Enable each only after doing its setup step.
#
#   led_effects.cfg  needs the third-party klipper-led_effect plugin cloned and
#                    the config file copied across -- guide section 8.1
#   timelapse.cfg    is created by moonraker-timelapse, a separate KIAUH
#                    component -- guide section 8.3
#
#[include led_effects.cfg]
#[include timelapse.cfg]

# ============================================================================
# MCU - XLBUDDY BOARD
# ============================================================================

[mcu]
# REPLACE THIS LINE after flashing Klipper:
# Run: ls /dev/serial/by-id/
# Copy the usb-Klipper_stm32f407xx_XXXXX device name here
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_XXXXXXXXX-if00
restart_method: command

# ============================================================================
# PCA9557 I2C GPIO EXPANDER - RELEASES DWARFS FROM RESET
# ============================================================================
# CRITICAL: Without this, Dwarfs have no power/lights and won't respond!

#[pca9557]
#i2c_bus: i2c2_PF1_PF0
#i2c_address: 25
# Automatically releases all Dwarfs from reset on Klipper connect



# ============================================================================
# PRINTER SETTINGS
# ============================================================================

[printer]
kinematics: corexy
max_velocity: 400
# STOCK: the XL runs 2500-4000 for print moves and 5000 for travel, against a
# 7000 hardware ceiling. 1800 was a conservative early value and it silently
# capped everything -- a slicer asking for 5000 got 1800 with no warning, which
# is most of why prints ran slower than stock. 4000 = stock's highest print
# acceleration (infill).
#
# THIS VALUE AND [input_shaper] BELONG TOGETHER. Stock runs this acceleration
# with input shaping ACTIVE, so the shaper section further down ships with
# Prusa's factory values enabled rather than commented out. Shipping the
# acceleration without the shaping would be copying half the machine. If you
# disable input shaping, put this back to 1800.
max_accel: 4000
max_z_velocity: 12
max_z_accel: 200
# Matches stock XY_HOMING_JERK / XL jerk of 8.
square_corner_velocity: 8.0

# ============================================================================
# X STEPPER (CoreXY A Motor)
# ============================================================================

[stepper_x]
step_pin: PD7
dir_pin: PD6
enable_pin: !PB9
microsteps: 16
rotation_distance: 40
endstop_pin: PE13
position_min: -8
position_endstop: -8
position_max: 361
homing_speed: 52
homing_retract_dist: 20
second_homing_speed: 52
homing_positive_dir: false

[tmc2130 stepper_x]
cs_pin: PG15
spi_software_sclk_pin: PC10
spi_software_mosi_pin: PC12
spi_software_miso_pin: PC11
run_current: 0.650
hold_current: 0.650
stealthchop_threshold: 0
interpolate: True
sense_resistor: 0.220
# Sensorless homing sensitivity. 1 is stock Prusa XL
# (Configuration_XL_adv.h:1327-1328, X/Y_STALL_SENSITIVITY) and is what ships
# here. Higher = the toolhead must push harder before the stall registers;
# lower = a gentler touch counts.
#
# IF YOUR HOMING BANGS: this dial is genuinely machine-dependent -- belt
# tension, friction and motor batch all move it. On the developer's own XL,
# tested 2026-08-15, stock 1 hit hard enough to sound like a skipped step;
# 0 homed softly and repeatably to -8/-9; -1 FALSE-TRIGGERED. So 0 is worth
# trying and -1 is too far. Change it only if you have a reason to.
driver_SGT: 1
driver_SFILT: 1
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5

# ============================================================================
# Y STEPPER (CoreXY B Motor)
# ============================================================================

[stepper_y]
step_pin: PD5
dir_pin: PD4
enable_pin: !PB9
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_min: -9
position_endstop: -9
position_max: 461
homing_speed: 52
homing_retract_dist: 20
second_homing_speed: 52
homing_positive_dir: false

[tmc2130 stepper_y]
cs_pin: PB5
spi_software_sclk_pin: PC10
spi_software_mosi_pin: PC12
spi_software_miso_pin: PC11
run_current: 0.650
hold_current: 0.650
stealthchop_threshold: 0
interpolate: True
sense_resistor: 0.220
# Sensorless homing sensitivity. 1 is stock Prusa XL
# (Configuration_XL_adv.h:1327-1328, X/Y_STALL_SENSITIVITY) and is what ships
# here. Higher = the toolhead must push harder before the stall registers;
# lower = a gentler touch counts.
#
# IF YOUR HOMING BANGS: this dial is genuinely machine-dependent -- belt
# tension, friction and motor batch all move it. On the developer's own XL,
# tested 2026-08-15, stock 1 hit hard enough to sound like a skipped step;
# 0 homed softly and repeatably to -8/-9; -1 FALSE-TRIGGERED. So 0 is worth
# trying and -1 is too far. Change it only if you have a reason to.
driver_SGT: 1
driver_SFILT: 1
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5

# ============================================================================
# Z STEPPERS (2 Motors - Left and Right)
# Prusa XL uses crash-based self-leveling, not Z-tilt
# ============================================================================

[stepper_z]
# Left Z motor
step_pin: PD3
dir_pin: !PD2
enable_pin: !PB8
microsteps: 16
rotation_distance: 4
endstop_pin: ^PB4
# For loadcell-based Z homing with SET_KINEMATIC_POSITION, position_endstop
# must be 0. With Prusa-style loadcell probing, Z=0 = nozzle at bed surface.
# Tool offsets from CALIBRATE_TOOL_OFFSETS handle all tool-to-tool differences.
position_endstop: 0
position_min: -9
position_max: 360
homing_speed: 8
second_homing_speed: 1

[tmc2130 stepper_z]
cs_pin: PG10
spi_software_sclk_pin: PC10
spi_software_mosi_pin: PC12
spi_software_miso_pin: PC11
run_current: 0.700
hold_current: 0.700
stealthchop_threshold: 0
interpolate: True
sense_resistor: 0.220
diag1_pin: ^PB4
# StallGuard settings for Z crash detection (uncomment when testing)
# driver_SGT: 3
# driver_TBL: 2
# driver_TOFF: 3
# driver_HEND: 1
# driver_HSTRT: 5

# ============================================================================
# STEPPER_Z1 - COMMENTED OUT (PD1/PD0 used for extruder)
# ============================================================================
# [stepper_z1]
# # Right Z motor
# step_pin: PD1
# dir_pin: !PD0
# enable_pin: !PD10
# microsteps: 16
# rotation_distance: 8

# [tmc2130 stepper_z1]
# cs_pin: PF12
# spi_software_sclk_pin: PC10
# spi_software_mosi_pin: PC12
# spi_software_miso_pin: PC11
# run_current: 0.8
# hold_current: 0.5
# stealthchop_threshold: 0
# interpolate: True
# sense_resistor: 0.110
# driver_TBL: 2
# driver_TOFF: 3
# driver_HEND: 1
# driver_HSTRT: 5

# ============================================================================
# BED MESH
# ============================================================================

[bed_mesh]
speed: 150
horizontal_move_z: 0.5
mesh_min: 30, 30
mesh_max: 330, 330
probe_count: 12, 12
algorithm: bicubic
fade_start: 1
fade_end: 10

# ============================================================================
# TEMPERATURE SENSORS
# ============================================================================

[temperature_sensor xlbuddy_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100


# ============================================================================
# HOMING WITH SENSORLESS ENDSTOPS
# ============================================================================

# Carries the Z-datum choice into [homing_override].
# NOT passed as G28 parameters: G28 is a standard gcode command, so Klipper
# parses it with args_r (gcode.py:201) and 'PROBE_TOOL=3' arrives as the
# literal string '=3', which |int turns into 0. Only extended commands get
# KEY=VALUE handling. A macro variable is read back cleanly.
# One-shot: the override resets both to 0 after homing, so any other G28
# (manual, or the internal ones in puppy_bootloader) homes on T0 as always.
[gcode_macro _KXL_Z_DATUM]
variable_probe_tool: 0
variable_single: 0
gcode:
    # variable container only - never invoked directly

[homing_override]
axes: xyz
gcode:
    {% set HOME_CUR = 0.750 %}
    {% set driver_config = printer.configfile.settings['tmc2130 stepper_x'] %}
    {% set RUN_CUR = driver_config.run_current %}
    # Which nozzle establishes Z=0. Defaults to T0, so every existing G28 -
    # including the internal ones in puppy_bootloader.py - is unchanged.
    {% set PROBE_TOOL = printer["gcode_macro _KXL_Z_DATUM"].probe_tool|int %}
    {% set SINGLE_MODE = printer["gcode_macro _KXL_Z_DATUM"].single|int %}
    {% set home_x = 'X' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set home_y = 'Y' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set home_z = 'Z' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% if home_z %}
    {% set home_x = True %}
    {% set home_y = True %}
    {% endif %}

    # Safety: move bed away from nozzle (set all axes for valid move)
    SET_KINEMATIC_POSITION X=180 Y=180 Z=0
    G90
    G1 Z10 F600
    M400

    {% if home_x or home_y %}
    # STOCK: XY_HOMING_ACCELERATION 1250 (Configuration_XL_adv.h:1340,
    # under IMPROVE_HOMING_RELIABILITY). Without this Klipper homes at the
    # printer max_accel, which is NOT what stock Prusa does.
    # XY_HOMING_JERK 8 already matches square_corner_velocity: 8.
    {% set RESTORE_ACCEL = printer.configfile.settings.printer.max_accel %}
    SET_VELOCITY_LIMIT ACCEL=1250
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_stall VALUE=1
    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_pushpull VALUE=1
    SET_TMC_FIELD STEPPER=stepper_x FIELD=TCOOLTHRS VALUE=300
    SET_TMC_FIELD STEPPER=stepper_x FIELD=sfilt VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_stall VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_pushpull VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=TCOOLTHRS VALUE=300
    SET_TMC_FIELD STEPPER=stepper_y FIELD=sfilt VALUE=0
    G4 P1000

    # Home Y (to Y=-8 front)
    {% if home_y %}
    G28 Y0
    G90
    G1 Y12 F3000
    M400
    {% endif %}
    # Home X (to X=-8)
    {% if home_x %}
    G28 X0
    G90
    G1 X10 F3000
    M400
    {% endif %}

    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_stall VALUE=0
    SET_TMC_FIELD STEPPER=stepper_x FIELD=TCOOLTHRS VALUE=0
    SET_TMC_FIELD STEPPER=stepper_x FIELD=sfilt VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_stall VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=TCOOLTHRS VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=sfilt VALUE=1
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR}
    SET_VELOCITY_LIMIT ACCEL={RESTORE_ACCEL}
    {% endif %}

    {% if home_z %}
    {% set home_x = True %}
    T{PROBE_TOOL}  # Pick probe tool so its loadcell is available
    G90
    G1 X180 Y180 F6000
    M400
    SET_KINEMATIC_POSITION Z=355
    M400
    LOADCELL_PROBE
    RESPOND MSG="Z homed via loadcell probe"
    {% set z_endstop = printer.configfile.settings["stepper_z"].position_endstop|default(0) %}
    SET_KINEMATIC_POSITION Z=0  # Apply position_endstop offset
    SET_Z_DATUM_TOOL TOOL={PROBE_TOOL} SINGLE={SINGLE_MODE}
    SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=probe_tool VALUE=0
    SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=single VALUE=0
    # NOTE: No APPLY_Z_OFFSET needed - Prusa-style loadcell probing means Z=0 is bed surface
    G1 Z20 F600  # Move bed out of the way
    M400
    {% endif %}

# ============================================================================
# ============================================================================
# PRUSA Z LEVEL MACRO - Crash-based Z alignment
# Rams bed to top frame to mechanically align both Z motors
# ============================================================================

# ============================================================================
# PRUSA Z LEVEL MACRO (restored from working_20260125 backup)
# ============================================================================
[gcode_macro PRUSA_Z_LEVEL]
description: Crash-based Z leveling (from Prusa G162.cpp reference)
gcode:
    _ASSERT_NOT_PRINTING WHAT=PRUSA_Z_LEVEL
    # Constants from Prusa firmware G162.cpp
    {% set RAM_SPEED = 15 %}         # Z_CALIB_ALIGN_AXIS_FEEDRATE = 15 mm/s
    {% set BACKOFF = 5 %}            # Z_CALIB_EXTRA_HIGHT = 5 mm
    {% set CRASH_CURRENT = 0.7 %}    # Z_CURRENT = 700mA from Configuration_XL_adv.h
    
    M117 Starting Prusa Z leveling...
    
    # Step 1: Move bed DOWN for initial clearance
    SET_KINEMATIC_POSITION Z=0
    G1 Z10 F{RAM_SPEED * 60}
    M400
    
    # Step 2: Home XY only
    G28 X Y
    M400
    
    # Step 3: Move to corner
    G0 X10 Y10 F6000
    M400
    
    # Step 4: Park tool if picked
    {% set puppy = printer["puppy_bootloader"] %}
    {% if puppy.tool_picked %}
        { action_respond_info("Tool T%d is picked - parking first" % puppy.active_tool) }
        SET_KINEMATIC_POSITION Z=100
        TOOL_PARK
        M400
    {% else %}
        { action_respond_info("No tool picked - proceeding") }
    {% endif %}
    
    # Step 5: Save and set crash current (0.7A - Z_CURRENT from Prusa firmware)
    {% set z_config = printer.configfile.settings['tmc2130 stepper_z'] %}
    {% set z_run_current = z_config.run_current %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={CRASH_CURRENT}
    G4 P300
    
    # Step 6: Ram Z motors into top frame
    M117 Ramming to align Z motors...
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-400 VELOCITY={RAM_SPEED}
    M400
    
    # Step 7: Back off
    M117 Backing off...
    FORCE_MOVE STEPPER=stepper_z DISTANCE={BACKOFF} VELOCITY={RAM_SPEED}
    M400
    
    # Step 8: Restore current
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_run_current}
    G4 P300
    
    # Step 9: Set position and move to safe height
    SET_KINEMATIC_POSITION Z={BACKOFF}
    G1 Z50 F{RAM_SPEED * 60}
    
    M117 Z level complete - run G28 Z to home

[gcode_macro STALLGUARD_Z_ALIGN]
description: Alias for PRUSA_Z_LEVEL
gcode:
    _ASSERT_NOT_PRINTING WHAT=STALLGUARD_Z_ALIGN
    PRUSA_Z_LEVEL


[gcode_macro _PARK_IF_TOOL_PICKED]
description: Park tool only if one is picked
gcode:
    {% if printer['gcode_macro TOOL_PICK'] is defined and printer['gcode_macro TOOL_PICK'].active_tool is defined %}
        {% if printer['gcode_macro TOOL_PICK'].active_tool >= 0 %}
            TOOL_PARK
        {% endif %}
    {% endif %}

[idle_timeout]
timeout: 1800

[force_move]
enable_force_move: True

# Set TMC2130 DIAG1 to push-pull mode at startup so pins are driven LOW
# (without this, open-drain + external pullup makes endstops read TRIGGERED)
[delayed_gcode init_diag_pushpull]
initial_duration: 2
gcode:
    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_pushpull VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_pushpull VALUE=1

# ============================================================================
# VIRTUAL SD & STATUS
# ============================================================================

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[respond]

# ============================================================================
# BASIC MACROS
# ============================================================================

# ============================================================================
# ============================================================================
# NOTES
# ============================================================================

# This configuration is for XLBuddy board ONLY
# Toolheads (Dwarfs) will use MODBUS bridge (setup separately)
# Bed heater is via MODBUS (setup separately)
#
# To use this config:
# 1. Copy entire file to ~/printer_data/config/printer.cfg
# 2. Update [mcu] serial line with your device
# 3. Restart Klipper: sudo systemctl restart klipper
# 4. Check for errors in Mainsail
#
# Prusa XL has 2 Z motors (not 3!)
# Z leveling uses crash detection - bed drives up until motors stall
# This is different from typical Z-tilt which uses 3 independent motors


# ============================================================================
# MODBUS - DWARF TOOLHEAD COMMUNICATION
# ============================================================================

#[modbus_master]

#[modbus_master T0]
#address: 1


# Enable 5V power to splitter/toolheads
[static_digital_output splitter_5v]
pins: PE14

[puppy_bootloader]

# ============================================================================
# DWARF TEMPERATURE SENSORS (via MODBUS polling)
# ============================================================================


# ============================================================================
# TOOLCHANGER
# Tool change commands (T0-T4, TOOL_PICK, TOOL_PARK, DOCK_CALIBRATE, etc.)
# are provided by the puppy_bootloader module with correct dock positions.
# Dock positions: T0=X25, T1=X107, T2=X189, T3=X271, T4=X353, Y=-3
# ============================================================================

# ============================================================================
# EXTRUDER (PD1/PD0 -> cable -> Dwarf TMC2130)
# TMC enable via MODBUS coil 0x4000 (controlled by puppy_bootloader)
# Heater via MODBUS register 0xE000 (controlled by SET_DWARF_TEMP)
# ============================================================================

[extruder]
# Klipper's guard against extruding more material than a move can physically
# hold. 50.0 disables it outright -- it never trips, so an over-extruding macro
# grinds the extruder and skips steps instead of raising an error. 4.0 still
# allows legitimately wide first-layer and purge moves (Klipper's own default is
# ~4x nozzle x layer height) while catching real mistakes.
max_extrude_cross_section: 4.0
step_pin: PD1
dir_pin: PD0
enable_pin: null:extruder_enable
heater_pin: null:extruder_heater
sensor_type: dwarf_hotend
dwarf: 0  # Dynamic - follows active tool - Dwarf-side thermal protection handles multi-tool
field: hotend_temp
microsteps: 16
rotation_distance: 8.42
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: -10
max_temp: 300
max_extrude_only_distance: 300
pressure_advance: 0.025
control: pid
pid_Kp: 30.0
pid_Ki: 3.0
pid_Kd: 80.0

[temperature_sensor T0_Hotend]
sensor_type: dwarf_hotend
dwarf: 1
field: hotend_temp
min_temp: -10
max_temp: 350

[temperature_sensor T1_Hotend]
sensor_type: dwarf_hotend
dwarf: 2
field: hotend_temp
min_temp: -10
max_temp: 350

[temperature_sensor T2_Hotend]
sensor_type: dwarf_hotend
dwarf: 3
field: hotend_temp
min_temp: -10
max_temp: 350

[temperature_sensor T3_Hotend]
sensor_type: dwarf_hotend
dwarf: 4
field: hotend_temp
min_temp: -10
max_temp: 350

[temperature_sensor T4_Hotend]
sensor_type: dwarf_hotend
dwarf: 5
field: hotend_temp
min_temp: -10
max_temp: 350

# ============================================================================
# CALIBRATION & TOOL MACROS (UI Wrappers)
# ============================================================================

[gcode_macro CALIBRATE_TOOLS]
description: Automatic tool offset calibration using calibration pin
gcode:
    _ASSERT_NOT_PRINTING WHAT=CALIBRATE_TOOLS
    CALIBRATE_TOOL_OFFSETS {rawparams}

[gcode_macro DOCK_CAL]
description: Calibrate dock positions
gcode:
    _ASSERT_NOT_PRINTING WHAT=DOCK_CAL
    DOCK_CALIBRATE {rawparams}

[gcode_macro Tool_Offsets]
description: Display tool offsets
gcode:
    SHOW_TOOL_OFFSETS

[gcode_macro LOADCELL_TEST]
description: Test loadcell probe
gcode:
    _ASSERT_NOT_PRINTING WHAT=LOADCELL_TEST
    LOADCELL_PROBE {rawparams}

[gcode_macro PICK_TOOL]
description: Pick up a tool (use T=0-4)
gcode:
    {% set tool = params.T|default(0)|int %}
    T{tool}

[gcode_macro PARK_TOOL]
description: Park current tool
gcode:
    _ASSERT_NOT_PRINTING WHAT=PARK_TOOL
    TOOL_PARK

# ============================================================================
# INPUT SHAPER - RESONANCE COMPENSATION
# ============================================================================

# Resonance tester - uses Dwarf accelerometer
[resonance_tester]
accel_chip: adxl345 dwarf_accel
probe_points: 180, 180, 20
accel_per_hz: 75
hz_per_sec: 1

[input_shaper]
# STOCK PRUSA XL FACTORY DEFAULTS -- active, not commented out.
#
# Verified against Prusa-Firmware-Buddy, file
#   lib/Marlin/Marlin/src/feature/input_shaper/input_shaper_config.hpp
# in the PRINTER_IS_PRUSA_XL() branch of axis_x_default / axis_y_default.
# (Other models in that same file differ -- CoreOne is 60.0/48.0, MINI is
# 118.2/32.8 -- so these are the XL's own numbers, not a shared fallback.)
# Prusa's damping_ratio there is 0.1, which is already Klipper's default.
#
# These ship enabled because max_accel is stock's 4000, and stock only runs
# that with shaping on. Leaving the section empty meant a fresh install had
# [input_shaper] declared but doing nothing.
#
# Run CALIBRATE_INPUT_SHAPER (defined below -- it homes first, then calls Klipper's
# SHAPER_CALIBRATE) to measure your own machine. Every XL differs, and
# SAVE_CONFIG will override these with your measured values.
shaper_type_x: mzv
shaper_freq_x: 35.8
shaper_type_y: mzv
shaper_freq_y: 35.4

# NOTE: With Prusa-style loadcell probing, no Z offset calibration needed!
# The loadcell probes WITH the nozzle - Z=0 = nozzle at bed surface.
# Run CALIBRATE_TOOL_OFFSETS to calibrate tool-to-tool differences (Prusa G425 method).

# Persistent variable storage for calibration data
[save_variables]
filename: ~/printer_data/config/variables.cfg

[exclude_object]
# Required for adaptive bed mesh to know print boundaries

[gcode_macro SET_GCODE_OFFSET]
rename_existing: _BASE_SET_GCODE_OFFSET
gcode:
    _BASE_SET_GCODE_OFFSET {rawparams}
    {% if 'Z_ADJUST' in (rawparams | upper) %}
        SAVE_TOOL_Z_OFFSET
    {% endif %}

# ============================================================================
# INPUT SHAPER - RESONANCE COMPENSATION
# ============================================================================

# Resonance tester - uses Dwarf accelerometer

[gcode_macro START_PRINT]
description: Start print with multi-tool support
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set PROBE_TEMP = 150 %}
    {% set TOOL = params.TOOL|default(0)|int %}
    # TOOLS = how many tools this job uses. The slicer supplies it; when it
    # is absent (older sliced files) TOOLS=0 and we take the multi-tool path,
    # which is the behaviour this printer has always had.
    {% set TOOLS = params.TOOLS|default(0)|int %}
    {% set SINGLE = (TOOLS == 1) %}
    # Single-tool jobs home Z with the printing nozzle, so no T0 heat-and-swap.
    {% set PROBE_TOOL = TOOL if SINGLE else 0 %}
    {% set X0 = params.X0|default(30)|float %}
    {% set Y0 = params.Y0|default(30)|float %}
    {% set X1 = params.X1|default(330)|float %}
    {% set Y1 = params.Y1|default(330)|float %}
    
    # Prusa-style probe spacing: ~30mm between probes, min 4 for bicubic
    {% set PROBE_SPACING = 30 %}
    {% set area_x = X1 - X0 %}
    {% set area_y = Y1 - Y0 %}
    {% set probe_x = ((area_x / PROBE_SPACING) | round(0, 'ceil') | int) + 1 %}
    {% set probe_y = ((area_y / PROBE_SPACING) | round(0, 'ceil') | int) + 1 %}
    {% set probe_x = [probe_x, 4] | max %}
    {% set probe_y = [probe_y, 4] | max %}
    {% set probe_x = [probe_x, 12] | min %}
    {% set probe_y = [probe_y, 12] | min %}

    RESPOND MSG="Starting print - Bed:{BED_TEMP}C Tool:T{TOOL} Temp:{EXTRUDER_TEMP}C"
    _status_heating

    # Step 1: Set adaptive bed area and start heating (non-blocking)
    SET_BED_AREA X0={X0} Y0={Y0} X1={X1} Y1={Y1}
    M140 S{BED_TEMP}

    # Step 2: Home XY first
    _status_homing
    RESPOND MSG="Homing XY..."
    G28 X Y

    # Step 3: Park any currently picked tool (now that XY is homed)
    {% set puppy = printer["puppy_bootloader"] %}
    {% if puppy.tool_picked and puppy.active_tool != 0 %}
        RESPOND MSG="Parking T{puppy.active_tool}..."
        TOOL_PARK
    {% endif %}

    # Step 4: Pick the probe tool and heat it to probe temp
    RESPOND MSG="Picking T{PROBE_TOOL} for probing..."
    T{PROBE_TOOL}
    M104 S{PROBE_TEMP}

    # Step 5: Wait for bed and probe-tool temp
    _status_heating
    RESPOND MSG="Waiting for bed {BED_TEMP}C and T{PROBE_TOOL} probe temp {PROBE_TEMP}C..."
    M190 S{BED_TEMP}
    M109 S{PROBE_TEMP}
    G4 P2000                  ; 2 second dwell for thermal stabilization

    # Step 6: Home Z with loadcell (probe tool at probe temp)
    _status_leveling
    RESPOND MSG="Homing Z with loadcell on T{PROBE_TOOL}{% if SINGLE %} (single-tool datum){% endif %}..."
    SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=probe_tool VALUE={PROBE_TOOL}
    SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=single VALUE={1 if SINGLE else 0}
    G28 Z

    # Step 7: Adaptive bed mesh with Prusa-style probe density
    _status_meshing
    RESPOND MSG="Bed mesh ({probe_x}x{probe_y}) for area ({X0},{Y0}) to ({X1},{Y1})"
    BED_MESH_CALIBRATE MESH_MIN={X0},{Y0} MESH_MAX={X1},{Y1} PROBE_COUNT={probe_x},{probe_y}

    # Step 7.5: Turn off the probe heater only if it is not the print tool
    {% if TOOL != PROBE_TOOL %}
        M104 S0
        SET_DWARF_TEMP DWARF={PROBE_TOOL + 1} TEMP=0
    {% endif %}

    # Step 8: Ensure the print tool is on the carriage.
    # UNCONDITIONAL on purpose. A macro template is rendered before it runs,
    # so this macro cannot observe which tool homing actually left picked -
    # it can only assume. Assuming is what put T0 on the bed for a T3 job.
    # Picking an already-picked tool short-circuits in puppy_bootloader
    # (re-applies offsets and returns), so this is cheap when correct.
    RESPOND MSG="Ensuring print tool T{TOOL} is picked..."
    T{TOOL}

    # Step 9: Heat print tool to print temp
    _status_heating
    G1 X10 Y10 Z10 F3000
    RESPOND MSG="Heating T{TOOL} to {EXTRUDER_TEMP}C..."
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Step 10: Prime line beside the print area
    #
    # EXTRUSION IS COMPUTED FROM THE LINE LENGTH. It used to be a hardcoded
    # E15 / E30, which meant a small part got the same 45mm of filament as a
    # large one crammed into a much shorter line. A 20mm-tall part produced a
    # ~6mm and a ~12mm wide bead from a 0.4mm nozzle -- the second pass landed
    # inside the first, the nozzle plowed through it, and the extruder skipped.
    #
    # THE LENGTH IS CLAMPED TO THE BED, NOT THE PART. Deriving it from the part
    # bounding box was the other half of that bug: a short part gave a short
    # line. The melt zone needs a real line to prime regardless of part size.
    #
    # RELATIVE E. The shipped OrcaSlicer profiles set use_relative_e_distances=1
    # (as does Prusa's own slicer), so the old absolute-style "E15 then E30 to
    # mean 15 more" silently extruded 30 on the second pass. M83 is stated
    # explicitly here so this block is correct whatever mode the slicer left set.
    # The line SLIDES to stay full length instead of being truncated. Starting at
    # Y0 and clamping the far end would squeeze a part near the back of the bed
    # down to a few mm of prime, which primes nothing -- so when it would run off
    # the end, the whole line is shifted down instead of shortened.
    {% set PRIME_LEN = 100 %}
    {% set prime_x  = [(X0 - 5), 10] | max %}
    {% set prime_y1 = [[Y0, 10] | max + PRIME_LEN, 350] | min %}
    {% set prime_y0 = [prime_y1 - PRIME_LEN, 10] | max %}
    {% set plen     = prime_y1 - prime_y0 %}
    # mm of 1.75mm filament per mm of travel for a W x 0.3mm bead
    # (1.75mm filament cross-section = 2.4053 mm^2)
    {% set e_wide   = (plen * 0.60 * 0.3 / 2.4053)|round(4) %}
    {% set e_norm   = (plen * 0.45 * 0.3 / 2.4053)|round(4) %}

    # MELT ZONE RECOVERY. END_PRINT and _MELT_RETRACT_ON_CANCEL pull E-20 out
    # of the hot end on purpose and record it per tool. That leaves 20mm of
    # VOID above the nozzle. The prime line only gives back ~13mm at these
    # widths, so without this the part itself pays the remaining ~7mm -- the
    # first perimeters run dry and plastic shows up late. Give back exactly
    # what was taken, then clear the flag so a second print, a manual load, or
    # a fresh spool never double-charges it.
    #
    # Mostly this refills void rather than extruding, so it is done at the
    # prime start with the nozzle lifted: anything that DOES emerge lands at
    # the head of the sacrificial purge line, which is where a prime blob
    # belongs, and the fat pass immediately drags away from it.
    {% set melt_rt = printer.save_variables.variables.get('melt_retract_t' ~ TOOL, 0)|float %}

    M83                                                    ; relative E
    G1 X{prime_x} Y{prime_y0} Z0.3 F3000
    {% if melt_rt > 0 %}
        RESPOND MSG="Refilling melt zone on T{TOOL}: E{melt_rt} pulled by the last END_PRINT"
        G1 Z4 F1000                                        ; lift clear of the bed
        G1 E{melt_rt} F180                                 ; 3mm/s = 7.2mm^3/s, under the flow cap
        G1 Z0.3 F1000
        SAVE_VARIABLE VARIABLE=melt_retract_t{TOOL} VALUE=0
    {% endif %}
    G1 X{prime_x} Y{prime_y1} E{e_wide} F1000              ; fat pass: purge
    G1 X{prime_x + 0.5} Y{prime_y1} F3000
    G1 X{prime_x + 0.5} Y{prime_y0} E{e_norm} F1000        ; clean pass: wipe
    G1 Z2 F1000

    _status_printing
    RESPOND MSG="Print starting with T{TOOL}..."
[gcode_macro _CLIENT_VARIABLE]
variable_user_cancel_macro: "_MELT_RETRACT_ON_CANCEL"
gcode:
    # variable container only - never invoked directly

[gcode_macro _MELT_RETRACT_ON_CANCEL]
description: Empty melt zone on cancel (mirrors END_PRINT deep retract)
gcode:
    {% set _temp = printer.extruder.temperature|float %}
    {% set _min = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set _tool = printer.puppy_bootloader.active_tool|default(-1)|int %}
    {% if _temp > _min %}
        RESPOND MSG="Cancel: deep retract (nozzle {_temp}C >= {_min}C)"
        G91
        G1 E-20 F1800
        G90
        # Record it so the next START_PRINT on this tool refills the melt zone
        {% if _tool >= 0 %}
            SAVE_VARIABLE VARIABLE=melt_retract_t{_tool} VALUE=20
        {% endif %}
    {% else %}
        RESPOND MSG="Cancel: nozzle {_temp}C below {_min}C - skipping deep retract"
    {% endif %}

[gcode_macro END_PRINT]
description: End print cleanup
gcode:
    # Deep retract to empty the melt zone while still at print temp (Prusa-style auto-retract)
    # Guarded: skip if nozzle is below min_extrude_temp (e.g. CANCEL_PRINT already killed heaters)
    #
    # THE RETRACT IS RECORDED so the next START_PRINT can give it back. Without
    # that, the next print on this tool spends its first real extrusions just
    # refilling 20mm of void -- the prime line only returns ~13mm, so the part
    # starts ~7mm of filament short and plastic arrives late. See the matching
    # recovery block in START_PRINT.
    {% set _temp = printer.extruder.temperature|float %}
    {% set _min = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set _tool = printer.puppy_bootloader.active_tool|default(-1)|int %}
    G91                    # Relative positioning
    {% if _temp > _min %}
        RESPOND MSG="END_PRINT: deep retract E-20 (nozzle {_temp}C)"
        G1 E-20 F1800         # deep retract: pull filament out of the hot zone
        {% if _tool >= 0 %}
            SAVE_VARIABLE VARIABLE=melt_retract_t{_tool} VALUE=20
        {% endif %}
    {% else %}
        RESPOND MSG="END_PRINT: nozzle {_temp}C below min_extrude_temp {_min}C - skipping deep retract"
    {% endif %}
    G1 Z10 F3000          # Lift Z
    G90                    # Absolute positioning
    # Turn off Klipper extruder heater (after the retract, so the pull happened hot)
    M104 S0
    # Fan off
    M106 S0
    
    # Clear bed mesh before XY move
    BED_MESH_CLEAR
    G1 X10 Y340 F6000     # Park at rear
    
    # Now park the tool
    TOOL_PARK
    
    # Turn off ALL tool heaters - however many tools this machine actually has.
    # This used to be five hardcoded SET_DWARF_TEMP DWARF=1..5 lines. On an XL
    # with fewer than 5 tools the first absent Dwarf raised and aborted the
    # whole macro, so CLEAR_BED_AREA / M140 S0 / M84 below never ran and the
    # BED STAYED HOT. DISABLE_ALL_HOTENDS iterates the Dwarfs that booted and
    # never raises - Marlin does the same thing with HOTEND_LOOP().
    #
    # ORDER MATTERS BELOW: CLEAR_BED_AREA must come BEFORE M140 S0. cmd_M140
    # only resets bed_global_target in its "no area set" branch; with an area
    # still set it takes the adaptive branch and leaves the target at e.g. 60,
    # and CLEAR_BED_AREA then re-heats all 16 bedlets. Do not swap these.
    DISABLE_ALL_HOTENDS
    CLEAR_BED_AREA            # Reset to full bed mode
    M140 S0               # Bed off

    # Disable steppers (except Z to hold position)
    M84 X Y E

    _status_complete
    RESPOND MSG="Print complete!"

# ============================================================================
# THERMAL PROTECTION (Proper Multi-Heater Architecture)
# ============================================================================
# Klipper's verify_heater is DISABLED for [extruder] because:
# 1. Each Dwarf runs Marlin firmware with full thermal runaway protection
# 2. Dwarf monitors heater at 100ms intervals (vs Klipper's 1s)
# 3. Dwarf fault_status register (0x8060) reports MARLIN_KILLED on thermal fault
# 4. puppy_bootloader monitors fault_status and triggers emergency stop
# This is the SAME architecture Prusa uses - XLBuddy doesn't do verify_heater
[verify_heater extruder]
check_gain_time: 9999
hysteresis: 50
max_error: 9999



# ============================================================================
# Z OFFSET (LIVE-Z) - Adjusted in OrcaSlicer, NOT in firmware
# ============================================================================
# Unlike stock Prusa firmware, KlipperXL does not use firmware-level babystep.
# Z offset is set in OrcaSlicer's printer profile (z_offset setting).
# Current reference value: 0.035mm (adjust for your machine)
#
# To tune: Print a first layer test, adjust z_offset in OrcaSlicer printer
# settings until the first layer looks right. Each machine will be different.
# ============================================================================

[gcode_arcs]
resolution: 0.1

# ============================================================================
# INPUT SHAPER CALIBRATION MACRO
# ============================================================================
[gcode_macro CALIBRATE_INPUT_SHAPER]
description: Run Input Shaper calibration (requires homing first)
gcode:
    _ASSERT_NOT_PRINTING WHAT=CALIBRATE_INPUT_SHAPER
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SHAPER_CALIBRATE

[gcode_macro TEST_RESONANCES_X]
description: Test X axis resonances only
gcode:
    _ASSERT_NOT_PRINTING WHAT=TEST_RESONANCES_X
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    TEST_RESONANCES AXIS=X

[gcode_macro TEST_RESONANCES_Y]
description: Test Y axis resonances only
gcode:
    _ASSERT_NOT_PRINTING WHAT=TEST_RESONANCES_Y
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    TEST_RESONANCES AXIS=Y

# ============================================================================
# SIDE LED STRIPS (WS2812 Neopixel)
# ============================================================================
# XLBuddy: SPI6 MOSI (PG14) shared with LCD via mux on PE9
# PE9 HIGH = route data to LEDs (we don't use LCD)

# ============================================================================
# PER-TOOL Z OFFSETS (first-layer fine-tuning)
# ============================================================================
# Each tool gets its own Z offset for perfect first layer adhesion.
# Adjust during printing with Mainsail's Z-offset +/- buttons,
# then click Save to capture the value for the active tool.
# Run SAVE_CONFIG to persist changes permanently.
#
# These are ADDITIVE to the calibrated tool offsets from CALIBRATE_TOOL_OFFSETS.
# Positive = nozzle further from bed, Negative = nozzle closer to bed.

[tool_offsets]
t0_z_offset: 0.0
t1_z_offset: 0.0
t2_z_offset: 0.0
t3_z_offset: 0.0
t4_z_offset: 0.0

# ============================================================================
# SIDE LED STRIP
# ============================================================================
# Prusa XL uses 2 daisy-chained WS2812 drivers per strip:
#   Driver 1 (index=1): RGB color
#   Driver 2 (index=2): White LED on Red channel
# To set white: SET_LED LED=side_leds INDEX=2 RED=0.5

[static_digital_output led_mux_select]
pins: PE9

[neopixel side_leds]
pin: PG14
chain_count: 2
color_order: RGB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# ============================================================================
# AUTOMATIC PER-TOOL PRESSURE ADVANCE
# ============================================================================
# Every tool measures, stores and uses its OWN PA value. This is not one
# setting shared across the toolhead group. See docs/PRESSURE_ADVANCE.md
#
# THESE MUST STAY ABOVE THE SAVE_CONFIG MARKER. This file ships without one --
# Klipper appends it the first time you run SAVE_CONFIG. Once it appears, keep
# every new section above it: Klipper rewrites everything from that marker down,
# and anything placed below is silently discarded with no error. That once
# disabled an entire calibrated input_shaper for two days before anyone noticed.
#
# Requires the analyser and its own virtualenv, both set up by
# scripts/INSTALL_ON_PI.sh:
#   ~/pa_analysis/       the analyser
#   ~/pa_analysis_env/   numpy + scipy, deliberately NOT klippy-env

# Loadcell recorder, sweep capture, and ANALYZE_PA.
[dwarf_pa_tuner]
# Defaults resolve against the Klipper user's home. Override if you moved them:
# analysis_python: ~/pa_analysis_env/bin/python
# analysis_script: ~/pa_analysis/pa_analyze.py

# Per-tool K storage and automatic re-apply on every tool change.
# Measured values land here via SAVE_CONFIG, in the autosave block Klipper
# creates at the end of the file.
[tool_pa]

# ============================================================================
# _ASSERT_NOT_PRINTING - shared refusal for anything that would wreck a print
# ============================================================================
# Called as the FIRST line of every macro that homes, probes, calibrates or
# swaps tools. One place to change the rule instead of eleven copies of it.
#
# WHY IT LIVES HERE AND NOT ON THE BUTTONS: guarding the button is not enough.
# _PA_TUNE_RUN was guarded first and CALIBRATE_PA was still reachable directly -
# one click walked straight past the guard and started a sweep on a running
# print. The refusal belongs on the thing that does the damage.
#
# DELIBERATELY NOT APPLIED to START_PRINT / END_PRINT / CANCEL_PRINT / PAUSE /
# RESUME / the timelapse + Mainsail client macros. Those MUST move during a
# print. START_PRINT in particular homes AND probes while print_stats already
# reads "printing", so a blanket guard would break every job.
#
# "paused" is refused too - pausing does not take the part off the bed.
[gcode_macro _ASSERT_NOT_PRINTING]
description: internal - refuse a command that would disturb a running print
gcode:
    {% set WHAT = params.WHAT|default("This command") %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("%s refused: a print is %s. It homes, probes or moves the toolhead and would wreck the running job." % (WHAT, printer.print_stats.state)) }
    {% endif %}

