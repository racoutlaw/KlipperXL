# ============================================================================
# LIGHT MACROS - clickable buttons for the Dwarf nozzle lights
# ============================================================================
# NOZZLE_LEDS is a Python command registered by [puppy_bootloader], and
# Mainsail only draws buttons for [gcode_macro] sections - so these thin
# wrappers exist purely to give it buttons.
#
# Drop them into a Mainsail macro group (Settings > Macros > Macrogroups) to
# keep them out of the main macro list.
#
# Each Dwarf holds ONE register (0xE004) packing TWO brightnesses,
# (selected_pwm << 8) | not_selected_pwm, and switches between them ITSELF
# off its is_selected coil. So these set a POLICY, not an on/off state - the
# tool does its own switching as it is picked and parked.
#
# Not persistent: a Klipper restart re-applies the default (ON).

[gcode_macro NOZZLE_LIGHTS_ON]
description: Nozzle lights follow the active tool (normal)
gcode:
    NOZZLE_LEDS STATE=ON

[gcode_macro NOZZLE_LIGHTS_OFF]
description: Nozzle lights off on every tool
gcode:
    NOZZLE_LEDS STATE=OFF

[gcode_macro NOZZLE_LIGHTS_ALWAYS]
description: Nozzle lights on always, even parked in the dock
gcode:
    NOZZLE_LEDS STATE=ALWAYS
