# KlipperXL - per-tool Pressure Advance tuning (XLPATuner Road B)
#
# Five buttons, one per tool. Click PA_TUNE_T<n> and it does the whole job
# unattended: home -> pick the tool -> heat -> sweep -> analyse -> apply that
# tool's K, then reminds you in the console to run SAVE_CONFIG.
#
# There is deliberately NO dialog macro here. Mainsail and Fluidd build a
# parameter panel automatically from the `params.X|default(...)` below, so each
# button already drops down TEMP / FILAMENT / SAVECONFIG fields with a SEND
# button. A prompt dialog could only ask which tool -- it could not set the
# temperature or the filament name -- so it was strictly worse than the UI the
# slicer front-end gives us for free.
#
# It deliberately does NOT auto-persist. The K goes live in memory the moment it
# is found, so the tool is already using it and you can print-test before
# committing -- and if the number looks wrong you simply never save it. Pass
# SAVECONFIG=1 for the fully hands-off version that persists and restarts Klipper.
#
# WHY SAVE_CONFIG IS NOT A LINE IN THESE MACROS: ANALYZE_PA runs the analyser as a
# background subprocess so it cannot block Klipper's reactor. A macro would therefore
# reach SAVE_CONFIG while the analysis was still running and persist nothing. Instead
# ANALYZE_PA ... SAVECONFIG=1 issues it from inside the module once the result is in.
#
# EACH RUN TAKES ~6 MINUTES and extrudes ~500mm of filament in free air at Z80 onto
# the unheated bed. It homes first, then changes tool, heats, sweeps, then drops the
# heater. Homing before the tool pick is REQUIRED, not stylistic: homing_override
# couples T0 for the Z probe, so picking a tool first would record T0's loadcell.
#
# TEMP defaults to PLA (215). For other materials set the fields, e.g.
#   PA_TUNE_T1 TEMP=240 FILAMENT=PETG


# The worker. Each PA_TUNE_T<n> below is a thin wrapper so every tool gets an
# identical run -- same range, same cycles, same analysis, same save path.
[gcode_macro _PA_TUNE_RUN]
description: internal - sweep, analyse and apply one tool's PA
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set TEMP = params.TEMP|default(215)|float %}
    {% set FIL  = params.FILAMENT|default('PLA') %}
    # SAVECONFIG defaults OFF on purpose. SAVE=1 already makes the new K LIVE in
    # memory, so the tool is using it immediately and you can print with it before
    # committing. ANALYZE_PA then prints a reminder to run SAVE_CONFIG. That keeps the
    # decision yours and avoids restarting Klipper the instant a sweep finishes.
    {% set SC = params.SAVECONFIG|default(0)|int %}
    RESPOND MSG="PA_TUNE: T{TOOL} at {TEMP}C ({FIL}) - sweep + analyse, ~6 min."
    CALIBRATE_PA TOOL={TOOL} TEMP={TEMP}
    ANALYZE_PA TOOL={TOOL} SAVE=1 SAVECONFIG={SC} FILAMENT={FIL}


[gcode_macro PA_TUNE_T0]
description: Auto-tune Pressure Advance for T0 (sweep, analyse, apply)
gcode:
    _PA_TUNE_RUN TOOL=0 TEMP={params.TEMP|default(215)} FILAMENT={params.FILAMENT|default('PLA')} SAVECONFIG={params.SAVECONFIG|default(0)}

